version: '3.8'

# Exemple générique pour documentation
services:
  api:
    image: monx/trash-collection-api:latest
    container_name: fr-trash-collection-api
    ports:
      - "9000:8000"
    volumes:
      - collecte_db:/app/data
      - ${HOST_PDFS_DIR:-./data/pdfs}:/app/data/pdfs
    environment:
      - PYTHONUNBUFFERED=1
      # Optionnel : définir une clé admin fixe. Si absent, une clé est auto-générée
      # et affichée dans les logs au démarrage (docker logs <container> | grep ADMIN_API_KEY)
      # - ADMIN_API_KEY=votre_clé_secrète
    restart: unless-stopped

volumes:
  collecte_db:
