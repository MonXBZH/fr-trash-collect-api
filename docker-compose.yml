services:
  api:
    image: monx/trash-collection-api:latest
    container_name: trash-collection-api
    ports:
      - "8000:8000"
    volumes:
      # Persister la base de données
      - ./trash_collection.db:/app/trash_collection.db
      # Monter le PDF calendrier
      - ./data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
